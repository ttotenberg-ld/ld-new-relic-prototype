# New Relic Python Agent configuration for the LaunchDarkly demo.
# Trimmed from the NR team's prototype (newrelic-launchdarkly-proto).
# License key and app name come from NEW_RELIC_LICENSE_KEY / NEW_RELIC_APP_NAME in .env.

[newrelic]
app_name = LaunchDarkly NR Demo
monitor_mode = true

# Span/trace settings from the prototype — the darkly-nr-integration agent
# branch forwards span data to the LaunchDarkly SDK before sampling.
span_events.enabled = true
collect_span_events = true
span_events.max_samples_stored = 10000000
distributed_tracing.enabled = true
startup_timeout = 15
shutdown_timeout = 10

# OTel bridge (prototype settings) — makes http.client calls emit OTel spans
transaction_tracer.stack_trace_threshold = 0
transaction_tracer.transaction_threshold = 0
opentelemetry.enabled = true
opentelemetry.traces.enabled = true
opentelemetry.traces.include = http.client
opentelemetry.traces.exclude = sqlalchemy

transaction_tracer.enabled = true
transaction_tracer.record_sql = obfuscated
error_collector.enabled = true
thread_profiler.enabled = true
code_level_metrics.enabled = false

# Forward app logs to New Relic, decorated with trace/span metadata
application_logging.enabled = true
application_logging.forwarding.enabled = true
application_logging.local_decorating.enabled = true
application_logging.forwarding.context_data.enabled = true

log_file = newrelic-agent.log
log_level = info
